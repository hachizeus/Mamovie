services:
  # Backend API service
  - type: web
    name: mamovie-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: CONSUMER_KEY
        sync: false
      - key: CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: CALLBACK_URL
        value: https://mamovie-api.onrender.com/callback

  # Frontend static site
  - type: web
    name: mamovie-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/build
    routes:
      - type: rewrite
        source: /static/*
        destination: /static/$1
      - type: rewrite
        source: /manifest.json
        destination: /manifest.json
      - type: rewrite
        source: /favicon.ico
        destination: /favicon.ico
      - type: rewrite
        source: /Mamovie.png
        destination: /Mamovie.png
      - type: rewrite
        source: /robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://mamovie-api.onrender.com/api/v1