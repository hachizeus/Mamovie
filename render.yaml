services:
  # Backend API service
  - type: web
    name: mamovie-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URL
        sync: false
      - key: TOKEN_SECRET
        sync: false
      - key: CONSUMER_KEY
        sync: false
      - key: CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: CALLBACK_URL
        value: https://mamovie-api.onrender.com/callback

  # Frontend static site
  - type: web
    name: mamovie-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/build
    routes:
      # These routes must come BEFORE the catch-all
      - type: file
        path: /static/*
      - type: file
        path: /*.{js,css,svg,jpg,png,ico,webp,gif,woff,woff2,ttf,eot}
      - type: file
        path: /manifest.json
      - type: file
        path: /robots.txt
      # Catch-all for SPA routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://mamovie-api.onrender.com/api/v1